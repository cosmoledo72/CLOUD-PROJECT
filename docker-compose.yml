# CLOUD-PROJECT (WorkHub) full stack: Postgres, Rust API, SvelteKit web (nginx),
# ONLYOFFICE Docs and nightly backups.
#
#   copy .env.example .env      # then set real secrets
#   docker compose up -d --build
#
# Web UI:            http://localhost:8080
# Document Server:   http://localhost:8081  (browser loads the editor from here)
# Backups:           ./backups  (see README, "Резервные копии")
#
# On the office server with the domain and HTTPS add the production overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

name: cloud-project

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workhub
      POSTGRES_USER: workhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workhub -d workhub"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://workhub:${POSTGRES_PASSWORD}@db:5432/workhub
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      DOCS_JWT_SECRET: ${DOCS_JWT_SECRET:?set DOCS_JWT_SECRET in .env}
      # How the Document Server reaches this API (inside the Docker network).
      INTERNAL_URL: http://backend:8080
      # How the browser reaches the Document Server.
      DOCS_PUBLIC_URL: ${DOCS_PUBLIC_URL:-http://localhost:8081}
      # How this API reaches the Document Server (inside the Docker network).
      DOCS_INTERNAL_URL: http://onlyoffice
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      LOGIN_ACCOUNT_LIMIT: ${LOGIN_ACCOUNT_LIMIT:-8}
      # Session lifetime with «Запомнить меня» on the login page (hours).
      REMEMBER_TTL_HOURS: ${REMEMBER_TTL_HOURS:-720}
      LOGIN_IP_LIMIT: ${LOGIN_IP_LIMIT:-30}
      SIGNUP_IP_LIMIT: ${SIGNUP_IP_LIMIT:-10}
      # Address users open the portal at; used in links sent by email.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Optional system-wide SMTP server for portals without their own.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CLOUD-PROJECT}
      # Unread notifications are emailed after this delay (seconds).
      NOTIFY_EMAIL_DELAY_SECS: ${NOTIFY_EMAIL_DELAY_SECS:-180}
      RUST_LOG: workhub_server=info,tower_http=info
      # «Администрирование → Резервные копии»: shown to administrators of this portal (slug).
      # A backup holds every portal of the server; empty = the section is off.
      BACKUP_PORTAL: ${BACKUP_PORTAL:-}
      BACKUP_DIR: /backups
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - blobs:/data/blobs
      # Read the backups and leave a «make a backup now» request for the backup service.
      - ${BACKUP_PATH:-./backups}:/backups
    healthcheck:
      test: ["CMD", "workhub-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Proxies allowed to report the client address (X-Forwarded-For).
      # Without the HTTPS proxy nobody is trusted; the prod overlay trusts Caddy.
      REAL_IP_FROM: ${REAL_IP_FROM:-127.0.0.1}
    ports:
      - "${WEB_PORT:-8080}:80"

  onlyoffice:
    # Pinned: update deliberately (see README, "Обновление ONLYOFFICE").
    image: onlyoffice/documentserver:${ONLYOFFICE_VERSION:-9.2.1}
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${DOCS_JWT_SECRET}
      JWT_HEADER: Authorization
      # The backend lives on a private Docker network address.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "${DOCS_PORT:-8081}:80"
    volumes:
      - oo-data:/var/www/onlyoffice/Data
      - oo-logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck | grep -q true"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  # Nightly database dump and file archive into ./backups, kept BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: workhub
      PGDATABASE: workhub
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Defaults only: the hour is set in «Резервные копии», the time zone is the
      # one of the BACKUP_PORTAL portal («Администрирование → Портал»).
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      BACKUP_PORTAL: ${BACKUP_PORTAL:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BLOBS_DIR: /data/blobs
      BACKUP_DIR: /backups
      TZ: ${TZ:-Asia/Sakhalin}
    volumes:
      - blobs:/data/blobs
      - ${BACKUP_PATH:-./backups}:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    command: ["loop"]

volumes:
  db-data:
  blobs:
  oo-data:
  oo-logs:
