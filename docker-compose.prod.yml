# HTTPS overlay: the portal on cloud-project.online via Caddy.
#
# Office server (Let's Encrypt certificates):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   (or scripts\start.cmd prod)
#   DNS: both names -> office public IP; router: forward TCP 80, 443 (and UDP 443) here.
#
# Developer PC (local certificates, hosts file): add docker-compose.local.yml
#   (or scripts\start.cmd local), see docs/SPEC.md, section 12.
#
# Optional in .env: PORTAL_DOMAIN, DOCS_DOMAIN, ACME_EMAIL.

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on: [web, onlyoffice]
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-cloud-project.online}
      DOCS_DOMAIN: ${DOCS_DOMAIN:-docs.cloud-project.online}
      ACME_EMAIL: ${ACME_EMAIL:-admin@cloud-project.online}
      # acme = Let's Encrypt, internal = Caddy's local CA (developer PC).
      CADDY_TLS: ${CADDY_TLS:-acme}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backend:
    environment:
      PUBLIC_URL: https://${PORTAL_DOMAIN:-cloud-project.online}
      DOCS_PUBLIC_URL: https://${DOCS_DOMAIN:-docs.cloud-project.online}
      COOKIE_SECURE: "true"
      # New portals are not created from the internet (SIGNUP_ENABLED in .env is
      # ignored here); set PROD_SIGNUP_ENABLED=true once to create the first one.
      SIGNUP_ENABLED: ${PROD_SIGNUP_ENABLED:-false}

  web:
    environment:
      # Caddy runs on the compose network: trust its X-Forwarded-For.
      REAL_IP_FROM: 172.16.0.0/12
    # Reachable from the internet only through Caddy; locally for checks.
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:80"

  onlyoffice:
    ports: !override
      - "127.0.0.1:${DOCS_PORT:-8081}:80"

volumes:
  caddy-data:
  caddy-config:
