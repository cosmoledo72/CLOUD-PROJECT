# Rendered by the nginx image at start (envsubst on templates): only the
# REAL_IP_FROM environment variable is substituted, nginx variables stay as they are.
server {
    listen 80;
    server_name _;

    # Behind the HTTPS proxy (Caddy) take the client address from X-Forwarded-For,
    # but only from REAL_IP_FROM; otherwise $remote_addr is the proxy itself.
    set_real_ip_from ${REAL_IP_FROM};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Must not be lower than MAX_UPLOAD_MB on the backend.
    client_max_body_size 512m;

    # Live notifications (server-sent events): no buffering, long-lived.
    location = /api/notifications/stream {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Backup downloads (Администрирование → Резервные копии): archives may be
    # gigabytes — stream them instead of buffering into temporary files.
    # A regex, not a prefix location: a prefix ending with "/" makes nginx answer
    # the same path without the slash with a 301 redirect.
    location ~ ^/api/admin/reserve/[^/]+/(db\.dump|files\.tar\.gz)$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Overwrites any client-supplied value; used by the API for rate limiting.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
    }

    location /_app/immutable/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
